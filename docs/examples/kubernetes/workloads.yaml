# See ../../self-host-kubernetes.md before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anviq-api
  labels:
    anviq.example/phase: app
  namespace: anviq
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: anviq-api
  template:
    metadata:
      labels:
        app: anviq-api
    spec:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: api
          image: ghcr.io/anviq-llc/sekundo/app@sha256:cec37eeb8230131ebf3e8aaf752e09439558d05e3581c6990734e8b4b515adeb
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 2Gi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: anviq-secrets
                  key: DATABASE_URL
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: anviq-secrets
                  key: ENCRYPTION_KEY
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: anviq-secrets
                  key: BETTER_AUTH_SECRET
            - name: SCREEN_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: anviq-secrets
                  key: SCREEN_PROXY_SECRET
            - name: SMTP_URL
              valueFrom:
                secretKeyRef:
                  name: anviq-secrets
                  key: SMTP_URL
                  optional: true
          envFrom:
            - configMapRef:
                name: anviq-config
          command:
            - node
            - --enable-source-maps
            - dist/index.js
          workingDir: /app/apps/api
          ports:
            - containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            timeoutSeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      terminationGracePeriodSeconds: 60
      serviceAccountName: anviq-controller
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: anviq-data
---
apiVersion: v1
kind: Service
metadata:
  name: anviq-api
  labels:
    anviq.example/phase: foundation
  namespace: anviq
spec:
  selector:
    app: anviq-api
  ports:
    - port: 3100
      targetPort: 3100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anviq-worker
  labels:
    anviq.example/phase: app
  namespace: anviq
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: anviq-worker
  template:
    metadata:
      labels:
        app: anviq-worker
    spec:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: worker
          image: ghcr.io/anviq-llc/sekundo/app@sha256:cec37eeb8230131ebf3e8aaf752e09439558d05e3581c6990734e8b4b515adeb
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 2Gi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: anviq-secrets
                  key: DATABASE_URL
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: anviq-secrets
                  key: ENCRYPTION_KEY
            - name: SMTP_URL
              valueFrom:
                secretKeyRef:
                  name: anviq-secrets
                  key: SMTP_URL
                  optional: true
          envFrom:
            - configMapRef:
                name: anviq-config
          command:
            - node
            - --enable-source-maps
            - dist/index.js
          workingDir: /app/apps/worker
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - node
                - dist/health-check.js
            periodSeconds: 15
            timeoutSeconds: 5
      terminationGracePeriodSeconds: 3000
      serviceAccountName: anviq-controller
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: anviq-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anviq-web
  labels:
    anviq.example/phase: app
  namespace: anviq
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: anviq-web
  template:
    metadata:
      labels:
        app: anviq-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: web
          image: ghcr.io/anviq-llc/sekundo/app@sha256:cec37eeb8230131ebf3e8aaf752e09439558d05e3581c6990734e8b4b515adeb
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "2"
              memory: 768Mi
              ephemeral-storage: 2Gi
          env:
            - name: SCREEN_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: anviq-secrets
                  key: SCREEN_PROXY_SECRET
          envFrom:
            - configMapRef:
                name: anviq-config
          command:
            - node_modules/.bin/vite
            - preview
            - --host
            - 0.0.0.0
            - --port
            - "5173"
          workingDir: /app/apps/web
          volumeMounts:
            - name: web-assets
              mountPath: /app/apps/web/asset-archive
          ports:
            - containerPort: 5173
          readinessProbe:
            tcpSocket:
              port: 5173
            periodSeconds: 5
      volumes:
        - name: web-assets
          persistentVolumeClaim:
            claimName: anviq-web-assets
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: anviq-web
  labels:
    anviq.example/phase: foundation
  namespace: anviq
spec:
  selector:
    app: anviq-web
  ports:
    - port: 5173
      targetPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: anviq-web-peers
  namespace: anviq
  labels:
    anviq.example/phase: foundation
spec:
  clusterIP: None
  selector:
    app: anviq-web
  ports:
    - port: 5173
      targetPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: anviq-ingress-peers
  namespace: kube-system
  labels:
    anviq.example/phase: foundation
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - port: 80
      targetPort: 8000
