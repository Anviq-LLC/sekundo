appId: com.sekundo.app
name: Messaging
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      ANVIQ_ACTIVE_EMAIL: ${ANVIQ_SCREENSHOT_EMAIL}
- openLink: "sekundo:///messaging"
- extendedWaitUntil:
    visible: ".*#launch.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-messaging
- tapOn: ".*#launch.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-team-conversation
